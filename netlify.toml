[build]
  command = "node build.js"
  publish = "_site"

[[redirects]]
  from = "/store"
  to   = "/"
  status = 301

[[redirects]]
  from = "/store.html"
  to   = "/"
  status = 301

[[redirects]]
  from = "/start-here"
  to   = "/programs.html"
  status = 301

[[redirects]]
  from = "/start-here.html"
  to   = "/programs.html"
  status = 301
